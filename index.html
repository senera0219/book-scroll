<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1a17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="스크롤하면 책 카드가 나오는 독서 앱">
  <title>책 스크롤</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="app/styles/base.css">
  <link rel="stylesheet" href="app/styles/feed.css">
</head>
<body>
  <header class="topbar">
    <nav class="tabs" id="tabs" aria-label="주제"></nav>
    <div class="text-size">
      <button type="button" id="open-settings" aria-label="설정" aria-haspopup="dialog">⚙&#xFE0E;</button>
    </div>
  </header>
  <dialog class="settings" id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">설정</h2>
      <fieldset>
        <legend>글자 크기</legend>
        <div class="size-row">
          <button type="button" id="text-smaller" aria-label="글자 작게">가−</button>
          <span class="size-sample" id="text-size-label" aria-live="polite">보통</span>
          <button type="button" id="text-bigger" aria-label="글자 크게">가+</button>
        </div>
      </fieldset>
      <fieldset>
        <legend>저장함 보기 방식</legend>
        <label class="option">
          <input type="radio" name="savedView" value="list">
          <span><strong>목록으로 보기</strong><br>책 제목과 저자만 먼저 보이고, 누르면 그 책이 카드 화면으로 열려요.</span>
        </label>
        <label class="option">
          <input type="radio" name="savedView" value="cards">
          <span><strong>카드 그대로 보기</strong><br>저장한 카드를 화면 그대로 한 장씩 넘겨 봐요.</span>
        </label>
      </fieldset>
      <button type="submit" class="close">닫기</button>
    </form>
  </dialog>
  <main class="feed" id="feed" aria-live="polite">
    <p class="feed-message">불러오는 중…</p>
  </main>
  <script type="module" src="app/js/main.js"></script>
</body>
</html>
